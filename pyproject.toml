[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "incometax"
version = "0.6.0"
description = "个人所得税联动计算器：累计预扣 · 年终奖择优 · 专项附加扣除 · 年度汇算（2019-2026 年度版本化规则集，全本地计算）"
readme = "README.md"
requires-python = ">=3.12"
# PEP 639：SPDX 表达式字符串（TOML 表写法已被 setuptools 弃用，硬期限 2027-02-18）
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yuluo554" }]
keywords = ["income-tax", "china-tax", "tax-calculator", "withholding", "annual-bonus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=5"]
# GUI 与打包依赖：Python >=3.12 下实测 PySide6 6.12 / PyInstaller 6.22（见 plan/03 选型表）
gui = ["PySide6>=6.12,<7"]
pkg = ["pyinstaller>=6.22,<7"]

[project.scripts]
incometax = "incometax.cli:main"

[project.urls]
Homepage = "https://github.com/yuluo554/income-tax-calculator"
Repository = "https://github.com/yuluo554/income-tax-calculator"
Issues = "https://github.com/yuluo554/income-tax-calculator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
