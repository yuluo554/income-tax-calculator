[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "incometax"
version = "0.5.0"
description = "个人所得税联动计算器：累计预扣 · 年终奖择优 · 专项附加扣除 · 年度汇算（2019-2026 年度版本化规则集，全本地计算）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "yuluo554" }]
keywords = ["income-tax", "china-tax", "tax-calculator", "withholding", "annual-bonus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=5"]
# GUI 与打包依赖留 M5 实装；版本上限为老解释器实测约束（见 plan/03 选型表）
gui = ["PySide6>=6.4,<6.7"]
pkg = [
    "pyinstaller>=5.13,<6; python_version < '3.9'",
    "pyinstaller>=6,<7; python_version >= '3.9'",
]

[project.scripts]
incometax = "incometax.cli:main"

[project.urls]
Homepage = "https://github.com/yuluo554/income-tax-calculator"
Repository = "https://github.com/yuluo554/income-tax-calculator"
Issues = "https://github.com/yuluo554/income-tax-calculator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
